<!doctype html>
<html>

<head>
    <title>CreateButton</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .inputButton {
            color: white;
            padding: 12px 20px; 
            border-radius: 5px;
            outline: none;
            border: none;
            cursor: pointer;
        }

        .button-on {
            background-color: rgb(25, 135, 84);
        }

        .button-off {
            background-color: rgb(220, 53, 69);
        }


    </style>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function CreateButton() {
            const [ buttonOn, setButtonOff ] = React.useState(false);

            function handleClick() {
                setButtonOff(!buttonOn)
            }

            return (
                <button
                className={buttonOn ? "inputButton button-on" : "inputButton button-off"}
                onClick={handleClick}
                >
                {buttonOn ? "ON" : "OFF"}
                </button>
            );
        }


        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<CreateButton />);

    </script>
</body>

</html>
